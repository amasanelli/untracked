# Copy to <repo>/.untracked.conf. Plain text, one entry per line.

# rclone destination (must be a remote from rclone.conf)
dest=hubc

# Optional: uploaded as <dest>/<name>.tar.gz. Defaults to origin repo name, else dir name.
# name=myrepo

# Files/dirs to back up, relative to repo root. Missing ones are skipped.
.env
